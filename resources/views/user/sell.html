<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell an item — Marketly</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#121826',mist:'#F6F7FB',cobalt:'#3157E5'}}}}</script></head><body class="bg-mist text-ink"><header class="border-b bg-white"><div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4"><a href="index.html" class="text-xl font-black">Marketly</a><a href="my-listings.html" class="text-sm font-bold">My Listings</a></div></header><main class="mx-auto max-w-4xl px-5 py-10"><div class="mb-8"><p class="text-sm font-bold text-cobalt">New listing</p><h1 class="text-3xl font-black">Sell an item</h1><p class="mt-2 text-slate-500">Add clear details so buyers know exactly what you're offering.</p></div><form class="space-y-6 rounded-3xl bg-white p-6 shadow-sm sm:p-8"><div><label class="font-bold">Photos</label><div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"><button type="button" class="aspect-square rounded-2xl border-2 border-dashed border-slate-300 text-sm font-semibold text-slate-500">+ Add photo</button><button type="button" class="aspect-square rounded-2xl border-2 border-dashed border-slate-200 text-sm text-slate-400">+ Add photo</button></div></div><div><label class="font-bold">Title</label><input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-cobalt" placeholder="e.g. iPhone 13 128GB"></div><div class="grid gap-4 sm:grid-cols-2"><div><label class="font-bold">Category</label><select class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3"><option>Electronics</option><option>Fashion</option><option>Books</option><option>Furniture</option><option>Sports</option><option>Other</option></select></div><div><label class="font-bold">Condition</label><select class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3"><option>New</option><option>Like new</option><option>Good</option><option>Fair</option></select></div></div><div class="grid gap-4 sm:grid-cols-2"><div><label class="font-bold">Price (MMK)</label><input type="number" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="0"></div><div><label class="font-bold">Location</label><input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="Township or area"></div></div><div><label class="font-bold">Description</label><textarea rows="6" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="Describe condition, what's included, and anything the buyer should know."></textarea></div><div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><a href="index.html" class="rounded-2xl border px-5 py-3 text-center font-bold">Cancel</a><button class="rounded-2xl bg-ink px-6 py-3 font-bold text-white">Publish listing</button></div></form></main></body></html>
