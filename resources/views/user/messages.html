<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Messages — Marketly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#121826',mist:'#F6F7FB',cobalt:'#3157E5'},boxShadow:{soft:'0 12px 40px rgba(18,24,38,.08)'}}}}}</script>
</head>
<body class="bg-mist text-ink">
<header class="sticky top-0 z-40 border-b bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
    <a href="index.html" class="flex items-center gap-2 text-xl font-black"><span class="grid h-9 w-9 place-items-center rounded-xl bg-ink text-white">M</span>Marketly</a>
    <div class="flex items-center gap-4 text-sm font-bold"><a href="index.html">Browse</a><a href="my-listings.html">My Listings</a></div>
  </div>
</header>
<main class="mx-auto max-w-6xl px-5 py-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div><p class="text-sm font-bold text-cobalt">Inbox</p><h1 class="text-3xl font-black">Messages</h1><p class="mt-2 text-slate-500">Conversations about your marketplace listings.</p></div>
    <div class="relative w-full sm:w-72"><input id="messageSearch" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-cobalt" placeholder="Search messages..."></div>
  </div>

  <div class="mt-6 overflow-hidden rounded-3xl bg-white shadow-soft" id="conversationList">
    <a href="conversation.html" data-search="aung kyaw iphone 13 128gb still available" class="conversation-row flex items-center gap-4 border-b p-5 hover:bg-slate-50">
      <div class="relative"><img src="assets/avatar-aung.svg" alt="Aung Kyaw profile" class="h-12 w-12 rounded-full object-cover"><span class="absolute -bottom-0.5 -right-0.5 h-3.5 w-3.5 rounded-full border-2 border-white bg-emerald-500"></span></div>
      <div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-3"><p class="font-bold">Aung Kyaw</p><span class="text-xs text-slate-400">10:42 AM</span></div><p class="truncate text-sm text-slate-500">Yes, it’s still available. You can check it this evening.</p><div class="mt-2 flex items-center justify-between"><span class="text-xs font-semibold text-cobalt">iPhone 13 · 128GB</span><span class="grid h-5 min-w-5 place-items-center rounded-full bg-cobalt px-1 text-[10px] font-bold text-white">2</span></div></div>
    </a>
    <a href="conversation.html" data-search="may thu minimal desk chair accept 85000" class="conversation-row flex items-center gap-4 p-5 hover:bg-slate-50">
      <img src="assets/avatar-may.svg" alt="May Thu profile" class="h-12 w-12 rounded-full object-cover">
      <div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-3"><p class="font-bold">May Thu</p><span class="text-xs text-slate-400">Yesterday</span></div><p class="truncate text-sm text-slate-500">Would you accept 85,000 MMK?</p><div class="mt-2 text-xs font-semibold text-cobalt">Minimal desk chair</div></div>
    </a>
  </div>
  <div id="emptyMessages" class="mt-6 hidden rounded-3xl border border-dashed border-slate-300 bg-white py-14 text-center text-slate-500">No conversations match your search.</div>
</main>
<script>
const search=document.getElementById('messageSearch'), rows=[...document.querySelectorAll('.conversation-row')], empty=document.getElementById('emptyMessages');
search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();let count=0;rows.forEach(r=>{const show=!q||r.dataset.search.includes(q);r.style.display=show?'flex':'none';if(show)count++;});empty.classList.toggle('hidden',count!==0);});
</script>
</body>
</html>
